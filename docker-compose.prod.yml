name: party-finder-prod
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pf
      POSTGRES_PASSWORD: pf
      POSTGRES_DB: partyfinder
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pf -d partyfinder"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pf:pf@db:5432/partyfinder
      UPLOAD_DIR: /data/uploads
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - uploads:/data/uploads
volumes:
  pgdata:
  uploads:
